<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মেসের হিসাব</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#16213a;--mute:#66728d;--line:#d8dfec;--zebra:#f4f6fb;--inp:#f2f5fa;--a1:#4f5bd5;--a2:#27308a;
--gG:linear-gradient(150deg,#12b072 0%,#067a52 48%,#03422d 100%);--gR:linear-gradient(150deg,#f04e68 0%,#c4122f 48%,#6e0820 100%);--gA:linear-gradient(135deg,var(--a1),var(--a2));--g:#059669;--r:#e11d48}
:root[data-acc=teal]{--a1:#12a7b5;--a2:#0a3f5c}:root[data-acc=violet]{--a1:#7c4dff;--a2:#2e1175}:root[data-acc=ocean]{--a1:#2f6fe4;--a2:#0f2a6b}:root[data-acc=graphite]{--a1:#4b5563;--a2:#0b1020}:root[data-acc=gold]{--a1:#b98a2c;--a2:#4f3408}:root[data-acc=rose]{--a1:#c0587a;--a2:#5a1633}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1322;--card:#172038;--ink:#e8edf8;--mute:#9aa6c4;--line:#27335a;--zebra:#1b2644;--inp:#212c4d;--g:#34d399;--r:#fb7185}}
:root[data-theme=dark]{--bg:#0d1322;--card:#172038;--ink:#e8edf8;--mute:#9aa6c4;--line:#27335a;--zebra:#1b2644;--inp:#212c4d;--g:#34d399;--r:#fb7185}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{overflow-x:hidden;max-width:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;font-size:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--inp);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:none;overflow:hidden;line-height:1.35;display:block}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--a1);outline-offset:1px}
header{position:sticky;top:0;z-index:5;background:var(--gA);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 10px;box-shadow:0 6px 18px -8px rgba(10,15,40,.5)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.top b{flex:1;font-size:19px}
#av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25) center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
#gear{background:rgba(255,255,255,.2);border:0;border-radius:10px;width:38px;height:34px;font-size:18px;color:#fff;cursor:pointer}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.2);padding:3px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;color:#fff;padding:8px 2px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--a2)}
main{max-width:720px;margin:0 auto;padding:12px}
section{display:none}section.on{display:block}
h2{font-size:24px;margin:2px 2px 10px;color:var(--a1)}
.mbar{display:grid;grid-template-columns:150px 1fr;gap:8px;margin-bottom:12px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:16px;color:#fff;margin-bottom:12px;border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 24px -10px rgba(10,20,40,.6),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -12px 24px -14px rgba(0,0,0,.35)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(170deg,rgba(255,255,255,.16),rgba(255,255,255,0) 38%);pointer-events:none}
.hero.g{background:var(--gG)}.hero.r{background:var(--gR)}.hero.a{background:var(--gA)}
.hero .big{font-size:34px;font-weight:700;line-height:1.2}.hero .lb{font-size:14px;opacity:.9}
.hero .ln{display:flex;justify-content:space-between;font-size:15px;opacity:.95;padding-top:3px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi .big{font-size:24px}
.tbl{border-radius:16px;border:1px solid var(--line);background:var(--card);overflow:hidden}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{background:var(--gA);color:#fff;padding:9px 6px;font-weight:600;font-size:14px;text-align:left}
td{padding:5px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:var(--zebra)}
tr.fri td.dl{color:var(--g);font-weight:700}
td.dl{font-weight:600;font-size:14px;padding-top:12px}
td input,td select,td textarea{padding:6px 6px;border-radius:8px;font-size:15px}
select.m{font-weight:700;text-align:center;padding-right:0}select.m.z{color:var(--r);border-color:var(--r)}select.m.f{color:var(--g);border-color:var(--g)}
tfoot td{background:var(--gA);color:#fff;font-weight:700;padding:10px 8px}
.del{background:none;border:0;color:var(--r);font-size:19px;padding:6px;cursor:pointer;border-radius:8px;line-height:1}
.btn{display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--gA);color:#fff;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.empty{padding:20px;text-align:center;color:var(--mute)}
.item{display:grid;grid-template-columns:1fr 104px;gap:8px;padding:12px;border-radius:16px;margin-bottom:10px;color:#fff;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 18px -10px rgba(10,20,40,.65),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -10px 20px -12px rgba(0,0,0,.35)}
.item::before{content:'';position:absolute;inset:0;background:linear-gradient(170deg,rgba(255,255,255,.15),rgba(255,255,255,0) 38%);pointer-events:none}
.item.p{background:var(--gG)}.item.u{background:var(--gR)}
.item input,.item textarea{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.38);color:#fff;position:relative}
::placeholder{color:var(--mute)}.item ::placeholder{color:rgba(255,255,255,.72)}
.bar{grid-column:1/-1;display:flex;gap:8px;align-items:center;position:relative}
.tog{flex:1;border:0;border-radius:10px;padding:9px;background:#fff;font-weight:700;cursor:pointer}
.item.p .tog{color:#047857}.item.u .tog{color:#be123c}.item .del{color:#fff;background:rgba(255,255,255,.2)}
.sel{display:flex;gap:6px;margin-bottom:8px}
.sel button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.sel button.on.i{background:var(--gG);border-color:transparent;color:#fff}.sel button.on.e{background:var(--gR);border-color:transparent;color:#fff}
.add,.cardx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;display:grid;gap:8px}
.dr{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}.wd{font-weight:600;color:var(--a1)}
.tx{display:grid;grid-template-columns:96px 1fr 38px;gap:6px;background:var(--card);border:1px solid var(--line);border-left:6px solid;border-radius:12px;padding:8px;margin-bottom:8px}
.tx.i{border-left-color:var(--g)}.tx.e{border-left-color:var(--r)}
.tx.i .amt{color:var(--g);font-weight:700}.tx.e .amt{color:var(--r);font-weight:700}
.tx .dr{grid-column:1/-1}
.cardx h3{margin:0 0 2px;color:var(--a1)}.lbl{font-size:13px;color:var(--mute)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw button.on{border-color:var(--ink)}
#pbig{width:84px;height:84px;border-radius:50%;background:var(--gA) center/cover;color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto;cursor:pointer}
.credit{text-align:center;color:var(--mute);margin-top:6px;font-weight:600}
.auth{position:fixed;inset:0;z-index:20;background:var(--gA);display:flex;align-items:center;justify-content:center;padding:20px}
.auth .box{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:380px;display:grid;gap:10px;box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}
.auth h1{margin:0;text-align:center;color:var(--a1)}.err{color:var(--r);font-size:14px;min-height:18px}
.lnk{background:none;border:0;color:var(--a1);font-weight:600;cursor:pointer;padding:6px}
#modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
#modal.on{display:flex}#modal div{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%}
#modal .bs{display:flex;gap:8px;margin-top:14px}#modal button{flex:1;padding:11px;border-radius:10px;border:0;font-weight:600;cursor:pointer}
#modal .y{background:var(--r);color:#fff}#modal .n{background:var(--inp)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;display:none}
#cbox{position:fixed;inset:0;background:rgba(10,15,30,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:35}#cbox.on{display:flex}#cbox>div{background:var(--card);border-radius:18px;padding:20px;max-width:340px;width:100%;text-align:center}#cCode{font-size:32px;font-weight:700;letter-spacing:3px;margin:12px 0;color:var(--a1);user-select:all}
#print{display:none}
@media print{body>*:not(#print){display:none!important}body{background:#fff;padding:0}#print{display:block;color:#000;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print h1{font-size:20px;margin:0}#print h2{font-size:15px;margin:14px 0 4px;color:#27308a}#print table{width:100%;border-collapse:collapse}
#print th,#print td{border:1px solid #999;padding:3px 5px;text-align:left}#print th{background:#27308a;color:#fff}.pg{color:#047857;font-weight:700}.pr{color:#be123c;font-weight:700}}
</style>
</head>
<body>

<div class="auth" id="auth">
  <div class="box">
    <h1>🍚 <span data-i="app">মেসের হিসাব</span></h1>
    <label class="lbl" id="aNameL" data-i="name">নাম</label>
    <input id="aName" data-p="name" placeholder="নাম" autocomplete="name">
    <label class="lbl" id="aPhoneL" data-i="phone">ফোন নাম্বার</label>
    <input id="aPhone" type="tel" inputmode="tel" data-p="phone" placeholder="ফোন নাম্বার" autocomplete="tel">
    <label class="lbl" id="aCodeL" data-i="code">রিকভারি কোড</label>
    <input id="aCode" data-p="code" autocapitalize="characters" autocomplete="off">
    <label class="lbl" id="aPassL">পাসওয়ার্ড</label>
    <input id="aPass" type="password" data-p="pass" placeholder="পাসওয়ার্ড" autocomplete="current-password">
    <label class="lbl" id="aBkL" data-i="bkPh"></label>
    <textarea id="aBk" rows="4" style="resize:vertical;overflow:auto"></textarea>
    <div class="err" id="aErr"></div>
    <button class="btn" id="aGo" style="margin:0"></button>
    <button class="lnk" id="aSw"></button>
    <button class="lnk" id="aFg" data-i="forgot"></button>
    <button class="lnk" id="aRs" data-i="restoreB"></button>
    <div class="lbl" style="text-align:center" data-i="authNote"></div>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="top"><div id="av"></div><b data-i="app"></b><button id="gear" aria-label="settings">⚙</button></div>
  <div class="tabs" id="tabs">
    <button class="on" data-t="meals" data-i="tm"></button>
    <button data-t="exp" data-i="te"></button>
    <button data-t="tx" data-i="tt"></button>
  </div>
</header>
<main>
  <div class="mbar" id="mbar"><input type="month" id="mon" aria-label="month"><input id="note" data-p="note"></div>

  <section id="s-meals" class="on">
    <h2 data-i="hm"></h2>
    <div class="tbl"><table>
      <colgroup><col style="width:34%"><col style="width:20%"><col><col style="width:36px"></colgroup>
      <thead><tr><th data-i="date"></th><th data-i="meal"></th><th data-i="reason"></th><th></th></tr></thead>
      <tbody id="meals"></tbody>
      <tfoot><tr><td colspan="4" id="mtot"></td></tr></tfoot>
    </table></div>
  </section>

  <section id="s-exp">
    <h2 data-i="he"></h2>
    <div id="esum"></div>
    <div id="exps"></div>
    <button class="btn" id="addExp" data-i="addExp"></button>
  </section>

  <section id="s-tx">
    <h2 data-i="ht"></h2>
    <div id="tsum"></div>
    <div class="add">
      <div class="sel"><button class="i on" data-type="i" data-i="inc"></button><button class="e" data-type="e" data-i="exp"></button></div>
      <div class="dr"><input type="date" id="nDate"><span class="wd" id="nwd"></span></div>
      <input id="nAmt" type="number" inputmode="decimal" min="0" data-p="amt">
      <textarea class="ag" rows="1" id="nWhy" data-p="whyEx"></textarea>
      <button class="btn" id="addTx" style="margin:0" data-i="add"></button>
    </div>
    <div id="txs"></div>
  </section>

  <section id="s-set">
    <h2 data-i="set"></h2>
    <div class="cardx">
      <div id="pbig" title="photo"></div><input type="file" id="pic" accept="image/*" hidden>
      <button class="lnk" id="picBtn" data-i="pic"></button>
      <div style="text-align:center"><b id="pname" style="font-size:18px"></b><div class="lbl" id="pph"></div></div>
      <button class="btn" id="chg" style="margin:0" data-i="chg"></button>
      <div id="chgBox" hidden style="display:grid;gap:8px">
        <span class="lbl" data-i="name"></span><input id="pn">
        <span class="lbl" data-i="phone"></span><input id="pp" type="tel" inputmode="tel">
        <span class="lbl" data-i="email"></span><input id="pe" type="email" inputmode="email">
        <span class="lbl" data-i="oldp"></span><input id="po" type="password" autocomplete="current-password">
        <span class="lbl" data-i="newp"></span><input id="pw" type="password" autocomplete="new-password">
        <button class="btn" id="saveInfo" style="margin:0" data-i="save"></button>
      </div>
    </div>
    <div class="cardx">
      <span class="lbl" data-i="color"></span>
      <div class="sw" id="sw"></div>
      <span class="lbl" data-i="mode"></span>
      <select id="mode"><option value="auto" data-i="mAuto"></option><option value="light" data-i="mLight"></option><option value="dark" data-i="mDark"></option></select>
      <span class="lbl" data-i="lang"></span>
      <select id="lang"><option value="bn">বাংলা</option><option value="en">English</option></select>
    </div>
    <div class="cardx">
      <h3 data-i="dl"></h3><span class="lbl" data-i="dlh"></span>
      <input type="month" id="pdfm"><button class="btn" id="pdfBtn" style="margin:0" data-i="dl"></button>
    </div>
    <div class="cardx"><h3 data-i="secT"></h3><span class="lbl" data-i="bkH"></span>
      <button class="btn" id="newCode" style="margin:0" data-i="newCode"></button>
      <button class="btn" id="mkBk" style="margin:0" data-i="mkBk"></button>
      <textarea id="bkOut" rows="4" hidden readonly style="overflow:auto"></textarea></div>
    <button class="btn" id="out" style="background:var(--gR)" data-i="out"></button>
    <div class="credit">Developed by Rahat</div>
  </section>
</main>
</div>

<div id="cbox"><div><b data-i="codeT"></b><div id="cCode"></div><p class="lbl" data-i="codeH"></p><button class="btn" id="cOk" style="margin:0" data-i="codeOk"></button></div></div>
<div id="print"></div>
<div id="modal"><div><p id="mmsg" style="margin:0;font-size:17px;font-weight:600"></p><div class="bs"><button class="n" id="mno"></button><button class="y" id="myes"></button></div></div></div>
<div id="toast"></div>

<script>

isPaid:['✔ জমা দেওয়া হয়েছে','✔ Paid'],notPaid:['জমা দেওয়া বাকি','Not paid yet'],inc:['আয়','Income'],exp:['ব্যায়','Expense'],tInc:['মোট আয়','Total income'],tExp:['মোট ব্যায়','Total expense'],bal:['অবশিষ্ট জমা','Balance'],

$('#pic').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(im.width,im.height);c.width=c.height=160;
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);me().photo=c.toDataURL('image/jpeg',.8);save();renderSet()};im.src=rd.result};rd.readAsDataURL(f)};
$('#lang').onchange=()=>{DB.ui.lang=$('#lang').value;save();renderAll();authUI()};
$('#mode').onchange=()=>{DB.ui.mode=$('#mode').value;save();theme()};
$('#out').onclick=()=>{DB.session='';save();$('#app').hidden=true;$('#auth').hidden=false;authMode='login';authUI()};

function pdf(key){
  const u=me(),r=u.data[key]||{note:'',meals:{},exp:[],tx:[]},[y,m]=key.split('-').map(Number),n=new Date(y,m,0).getDate(),s=sums(r);
  let a='';for(let d=1;d<=n;d++){const e=r.meals[d]||{};a+=`<tr><td>${dayLabel(new Date(y,m-1,d))}</td><td>${e.m===''||e.m==null?'':num(e.m)}</td><td>${esc(e.skip)}</td></tr>`}
  const b=r.exp.map(x=>`<tr><td>${esc(x.name)}</td><td>৳ ${num(x.amt)}</td><td class="${x.paid?'pg':'pr'}">${x.paid?t('isPaid')+(x.pd?' • '+shortD(x.pd):''):t('notPaid')}</td></tr>`).join('');
  const c=r.tx.map(x=>`<tr><td>${shortD(x.date)} (${wd(x.date)})</td><td class="${x.type==='i'?'pg':'pr'}">${x.type==='i'?'+':'−'} ৳ ${num(x.amt)}</td><td>${esc(x.why)}</td></tr>`).join('');
  $('#print').innerHTML=`<h1>${t('app')} — ${MON[m-1]} ${dg(y)}</h1><p><b>${esc(u.name)}</b> • ${esc(u.phone)}${r.note?' • '+esc(r.note):''}</p>
  <h2>${t('hm')}</h2><table><tr><th>${t('date')}</th><th>${t('meal')}</th><th>${t('reason')}</th></tr>${a}<tr><td><b>${t('totMeal')}</b></td><td colspan="2"><b>${num(s.mt)}</b></td></tr></table>
  <h2>${t('he')}</h2><table><tr><th>${t('item').split(' (')[0]}</th><th>${t('amt')}</th><th></th></tr>${b}<tr><td><b>${t('due')}</b></td><td colspan="2"><b>৳ ${num(s.due)}</b> (${t('all')}: ৳ ${num(s.all)})</td></tr></table>
  <h2>${t('ht')}</h2><table><tr><th>${t('date')}</th><th>${t('amt')}</th><th>${t('whyEx')}</th></tr>${c}<tr><td><b>${t('tInc')} / ${t('tExp')}</b></td><td colspan="2">৳ ${num(s.inc)} / ৳ ${num(s.ex)}</td></tr><tr><td><b>${t('bal')}</b></td><td colspan="2"><b>৳ ${num(s.bal)}</b></td></tr></table>`;
  const old=document.title;document.title='Mess-Hisab-'+key;window.print();setTimeout(()=>document.title=old,1500);
}
$('#pdfBtn').onclick=()=>pdf($('#pdfm').value||cur);

theme();i18n();authUI();
if(DB.session&&DB.users[DB.session])start();
</script>
</body>
</html>
